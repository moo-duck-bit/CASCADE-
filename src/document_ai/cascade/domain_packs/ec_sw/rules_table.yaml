# notes: 적용 여부를 바꾸지 않는 예외 문구(만족 간주). 이런 속성은 규칙 없이 LLM 판단 경로로 가고 문구를 근거로 준다.
# v1과 다른 점: password_auth는 원문상 IA-05만 정한다(v1은 IA-05·IA-06). session_termination은 UC-03 적용 여부를 바꾸지 않는다(notes).
